# Install as /etc/nginx/sites-available/uk-wsr-visualizer.conf and symlink into sites-enabled.

upstream visualizer_wct_api {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name ncas-rsg-cloud-workstation-ssh 130.246.214.121;

    client_max_body_size 100m;

    access_log /var/log/nginx/uk-wsr-visualizer-access.log;
    error_log /var/log/nginx/uk-wsr-visualizer-error.log;

    location / {
        proxy_pass http://visualizer_wct_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location /api/export {
        proxy_pass http://visualizer_wct_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 900s;
    }
}
