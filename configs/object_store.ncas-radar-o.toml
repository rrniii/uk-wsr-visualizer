[object_store]
tenancy = "ncas-radar-o"
staging_bucket = "uk-wsr-visualizer-staging"
public_bucket = "uk-wsr-visualizer-public"
object_prefix = "uk-radar"

internal_endpoint = "http://ncas-radar-o.s3.jc.rl.ac.uk"
external_endpoint = "https://ncas-radar-o.s3-ext.jc.rl.ac.uk"
public_base_url = "https://ncas-radar-o.s3-ext.jc.rl.ac.uk/uk-wsr-visualizer-public"

aws_profile = "ncas-radar-o"
region_name = "us-east-1"
allowed_origins = [
  "http://130.246.214.121",
  "https://130.246.214.121",
]

multipart_chunk_mb = 256
publish_aggregate_h5 = true
publish_previews = true
publish_tiles = true
publish_stac = true
publish_validation_reports = true
publish_exports = false

dataset_title = "UK WSR aggregate HDF5 source objects"
dataset_description = "Daily UK weather surveillance radar aggregate HDF5 source objects prepared from approved archive holdings, with browser-ready catalogues, STAC metadata, checksums, previews, tiles, and release-validation reports for UK WSR Visualizer. Original restricted archive files are excluded from this public object-store release."
dataset_license = "Public redistribution approved for UK WSR aggregate HDF5 outputs; original NIMROD archives excluded. Replace this with final institutional licence text before public announcement."
dataset_citation = "Formal UK WSR aggregate HDF5 source-data citation pending. Do not substitute a citation for a different data product family, and do not cite the object-store mirror as the source-data record."
dataset_provider_name = "NCAS Radar Science Group"
dataset_provider_url = "https://ncas.ac.uk/"
dataset_contact_email = "R.Neely@leeds.ac.uk"
dataset_terms_url = ""
