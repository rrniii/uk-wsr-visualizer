[object_store]
tenancy = "ncas-radar-o"
staging_bucket = "avocet-uk-radar-staging"
public_bucket = "avocet-uk-radar-public"
object_prefix = "uk-radar"

internal_endpoint = "http://ncas-radar-o.s3.jc.rl.ac.uk"
external_endpoint = "https://ncas-radar-o.s3-ext.jc.rl.ac.uk"
public_base_url = "https://ncas-radar-o.s3-ext.jc.rl.ac.uk/avocet-uk-radar-public"

aws_profile = "ncas-radar-o"
region_name = "us-east-1"
allowed_origins = [
  "http://130.246.214.121",
  "https://130.246.214.121",
]

multipart_chunk_mb = 256
publish_aggregate_h5 = true
publish_previews = true
publish_tiles = true
publish_stac = true
publish_validation_reports = true
publish_exports = false

dataset_title = "Avocet UK Radar Aggregate HDF5"
dataset_description = "Daily UK Met Office radar aggregate HDF5 files produced by the Avocet radar pipeline, with browser-ready previews, tiles, STAC metadata, checksums, and WCT-style export validation products generated by the Avocet Radar Toolkit. Original NIMROD archives are excluded from this public object-store release."
dataset_license = "Public redistribution approved for Avocet aggregate HDF5 outputs; original NIMROD archives excluded. Replace this with final institutional licence text before public announcement."
dataset_citation = "Neely, R. and NCAS Radar Science Group. Avocet UK Radar Aggregate HDF5 dataset. NCAS Radar Science Group, University of Leeds. Distributed via the JASMIN Object Store."
dataset_provider_name = "NCAS Radar Science Group"
dataset_provider_url = "https://ncas.ac.uk/"
dataset_contact_email = "R.Neely@leeds.ac.uk"
dataset_terms_url = ""
