[object_store]
# Replace this with the Object Store tenancy name issued in the JASMIN Accounts Portal.
tenancy = "my-os-tenancy"

# Use separate buckets so production publication can be promoted deliberately.
staging_bucket = "uk-wsr-visualizer-staging"
public_bucket = "uk-wsr-visualizer-public"

# The production Avocet data release uses ukmo-nimrod/pvol for public pvol files.
object_prefix = "ukmo-nimrod"

# Defaults follow the current JASMIN endpoint pattern:
# internal: http://{tenancy}-o.s3.jc.rl.ac.uk
# external: https://{tenancy}-o.s3-ext.jc.rl.ac.uk
internal_endpoint = "http://my-os-tenancy-o.s3.jc.rl.ac.uk"
external_endpoint = "https://my-os-tenancy-o.s3-ext.jc.rl.ac.uk"
public_base_url = "https://my-os-tenancy-o.s3-ext.jc.rl.ac.uk/uk-wsr-visualizer-public"

# Use "*" for initial smoke testing only. Replace with the deployed web origin.
allowed_origins = ["https://ncas-rsg-cloud-workstation-ssh"]

multipart_chunk_mb = 256
publish_aggregate_h5 = false
publish_previews = true
publish_tiles = true
publish_stac = true
publish_validation_reports = true

# Public dataset metadata copied into STAC, status.json, and release summaries.
dataset_title = "UKMO NIMROD pvol HDF5"
dataset_description = "Per-volume ODIM-like HDF5 files prepared from UKMO NIMROD single-site radar data for vol2bird and bioRad processing."
dataset_license = "proprietary"
dataset_citation = ""
dataset_provider_name = "NCAS Radar Science Group"
dataset_provider_url = ""
dataset_contact_email = ""
dataset_terms_url = ""

# Keep false until generated products have been reviewed for public release.
publish_exports = false
