name: macOS Beta

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "apple/**"
      - "docs/**"
      - "macos/**"
      - "src/**"
      - "tests/**"
      - "tools/**"
      - ".github/workflows/macos-beta.yml"
      - "pyproject.toml"
  pull_request:
    branches: [master]
    paths:
      - "apple/**"
      - "docs/**"
      - "macos/**"
      - "src/**"
      - "tests/**"
      - "tools/**"
      - ".github/workflows/macos-beta.yml"
      - "pyproject.toml"

jobs:
  build-macos-beta:
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check out pinned active QC runtime
        uses: actions/checkout@v4
        with:
          repository: rrniii/uk-wsr-qc
          ref: 10f05f615c8ea9c5924fac7d4fa00a6d8fb21cae
          path: uk-wsr-qc
          ssh-key: ${{ secrets.QC_REPO_DEPLOY_KEY }}
          persist-credentials: false

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python test dependencies
        run: |
          python -m pip install ./uk-wsr-qc
          python -m pip install -e ".[dev,video]"

      - name: Run focused macOS packaging tests
        run: python -m unittest tests.test_macos_app tests.test_api_public_metadata

      - name: Verify MP4 encoder
        run: python -c "from uk_wsr_visualizer.video_self_test import run_video_self_test; print(run_video_self_test())"

      - name: Configure optional Developer ID signing certificate
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.MACOS_SIGNING_KEYCHAIN_PASSWORD }}
        run: |
          if [ -z "${MACOS_CERTIFICATE_P12_BASE64}" ]; then
            echo "No Developer ID certificate configured; building an unsigned beta artifact."
            exit 0
          fi
          CERTIFICATE_PATH="$RUNNER_TEMP/developer-id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/uk-wsr-signing.keychain-db"
          KEYCHAIN_PASSWORD="${KEYCHAIN_PASSWORD:-temporary-keychain-password}"
          echo "$MACOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

      - name: Build macOS Xcode beta
        env:
          UK_WSR_QC_ROOT: ${{ github.workspace }}/uk-wsr-qc
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          DEVELOPER_ID_APPLICATION: ${{ secrets.DEVELOPER_ID_APPLICATION }}
          NOTARYTOOL_KEYCHAIN_PROFILE: ${{ secrets.NOTARYTOOL_KEYCHAIN_PROFILE }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          if [ -n "${MACOS_CERTIFICATE_P12_BASE64}" ] && [ -n "${DEVELOPER_ID_APPLICATION}" ]; then
            export CODE_SIGNING_ALLOWED=YES
            if [ -n "${NOTARYTOOL_KEYCHAIN_PROFILE}" ] || { [ -n "${APPLE_ID}" ] && [ -n "${APPLE_TEAM_ID}" ] && [ -n "${APPLE_APP_SPECIFIC_PASSWORD}" ]; }; then
              export NOTARIZE=1
            fi
          else
            unset DEVELOPER_ID_APPLICATION
            export CODE_SIGNING_ALLOWED=NO
          fi
          macos/build-xcode-macos.sh

      - name: Upload macOS beta artifact
        uses: actions/upload-artifact@v4
        with:
          name: UK WSR Visualizer macOS Xcode Beta
          path: build/xcode-macos/UK WSR Visualizer macOS Xcode Beta.zip

      - name: Clean up optional signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/uk-wsr-signing.keychain-db" || true
