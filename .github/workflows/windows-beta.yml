name: Windows Beta

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "src/**"
      - "tests/**"
      - "windows/**"
      - ".github/workflows/windows-beta.yml"
      - "pyproject.toml"
  pull_request:
    branches: [master]
    paths:
      - "src/**"
      - "tests/**"
      - "windows/**"
      - ".github/workflows/windows-beta.yml"
      - "pyproject.toml"

jobs:
  build-windows-beta:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check out pinned active QC runtime
        uses: actions/checkout@v4
        with:
          repository: rrniii/uk-wsr-qc
          ref: 0addd2a693940fa0cd2af8fedb432e4e8e645702
          path: uk-wsr-qc
          ssh-key: ${{ secrets.QC_REPO_DEPLOY_KEY }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ./uk-wsr-qc
          python -m pip install -e ".[dev,video]"

      - name: Run focused Python tests
        run: python -m unittest tests.test_windows_app tests.test_static_viewer tests.test_remote_cache tests.test_api_public_metadata

      - name: Build Windows portable beta
        shell: pwsh
        run: .\windows\build.ps1 -SkipTests

      - name: Run packaged self-test
        shell: pwsh
        run: '& ".\build\windows-beta\UK WSR Visualizer\UK WSR Visualizer.exe" --self-test'

      - name: Verify packaged MP4 encoder
        shell: pwsh
        run: '& ".\build\windows-beta\UK WSR Visualizer\server\uk-wsr-visualizer-server.exe" --video-self-test'

      - name: Upload Windows beta artifact
        uses: actions/upload-artifact@v4
        with:
          name: UK WSR Visualizer Windows Beta
          path: build/windows-beta/UK WSR Visualizer Windows Beta.zip
