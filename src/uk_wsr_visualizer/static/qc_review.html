<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UK WSR QC Blinded Review</title>
  <link rel="stylesheet" href="/static/qc_review.css">
</head>
<body>
  <header class="topbar">
    <div class="identity">
      <strong>UK WSR QC Review</strong>
      <span id="reviewIdentity">Loading</span>
    </div>
    <div class="progress-block">
      <span id="progressLabel">0 / 0</span>
      <progress id="progressBar" value="0" max="1"></progress>
    </div>
    <nav class="navigation" aria-label="Review targets">
      <button id="previousTarget" type="button" title="Previous target" aria-label="Previous target">&larr;</button>
      <button id="nextTarget" type="button" title="Next target" aria-label="Next target">&rarr;</button>
    </nav>
  </header>

  <div class="workspace">
    <aside class="review-controls">
      <section class="target-summary">
        <div class="completion-line">
          <span id="completionMarker" class="completion-marker"></span>
          <span id="targetPosition">Target</span>
        </div>
        <h1 id="targetTitle">Loading target</h1>
        <dl id="targetMetadata"></dl>
      </section>

      <section class="region-editor">
        <div class="prelabel-block">
          <div class="section-heading">
            <h2>Fuzzy prelabel</h2>
            <span id="prelabelStatus" class="proposal-badge">Proposal</span>
          </div>
          <p id="prelabelSummary">Computing independent evidence.</p>
          <label class="proposal-overlay-toggle">
            <input id="showPrelabelOverlay" type="checkbox" checked>
            <span>Show proposal on radar</span>
          </label>
          <div class="prelabel-opacity">
            <label for="prelabelOpacity">Proposal opacity <output id="prelabelOpacityValue">32%</output></label>
            <input id="prelabelOpacity" type="range" min="0.05" max="0.80" step="0.05" value="0.32">
          </div>
          <div id="prelabelEvidence" class="prelabel-evidence"></div>
          <div class="prelabel-actions">
            <button id="acceptPrelabel" type="button" class="accept-command">Correct</button>
            <button id="editPrelabel" type="button">Wrong - edit</button>
          </div>
        </div>

        <h2>Selection</h2>
        <div class="tool-selector" role="group" aria-label="Selection tool">
          <button id="brushTool" type="button" class="active" aria-pressed="true">Brush</button>
          <button id="polygonTool" type="button" aria-pressed="false">Region</button>
        </div>
        <div id="brushControls" class="brush-controls">
          <label for="brushSize">Brush size <output id="brushSizeValue">24 px</output></label>
          <input id="brushSize" type="range" min="8" max="72" step="4" value="24">
          <label class="eraser-toggle">
            <input id="eraserMode" type="checkbox">
            <span>Eraser</span>
          </label>
        </div>

        <label for="labelSelect">Classification</label>
        <select id="labelSelect"></select>
        <div class="classification-meta">
          <span id="actionBadge" class="action-badge"></span>
          <span id="classificationDescription"></span>
        </div>

        <label for="confidenceInput">Confidence <output id="confidenceValue">0.90</output></label>
        <input id="confidenceInput" type="range" min="0" max="1" step="0.05" value="0.90">

        <label for="regionNotes">Region notes</label>
        <textarea id="regionNotes" rows="2"></textarea>

        <div class="editor-actions">
          <button id="undoVertex" type="button" disabled>Undo last edit</button>
          <button id="addPolygon" type="button" class="primary-command">Add selection</button>
          <button id="addFullSweep" type="button">Full sweep</button>
        </div>
      </section>

      <section class="region-list-section">
        <div class="section-heading">
          <h2>Labels</h2>
          <span id="regionCount">0</span>
        </div>
        <div id="regionList" class="region-list"></div>
      </section>

      <section class="review-notes">
        <label for="reviewNotes">Sweep notes</label>
        <textarea id="reviewNotes" rows="3"></textarea>
      </section>

      <button id="saveTarget" type="button" class="save-command">Save and next</button>
      <div id="statusMessage" class="status-message" role="status" aria-live="polite"></div>
    </aside>

    <main class="evidence-area">
      <section class="annotation-section">
        <div class="section-heading">
          <div>
            <h2>Raw DBZH</h2>
            <div id="dbzhColourbar" class="colourbar-host"></div>
          </div>
          <span id="draftStatus" class="draft-status">0 points</span>
        </div>
        <div class="canvas-shell">
          <canvas id="annotationCanvas" width="720" height="720"></canvas>
        </div>
      </section>

      <section class="companion-section">
        <h2>Raw companion fields</h2>
        <div id="fieldGallery" class="field-gallery"></div>
      </section>
    </main>
  </div>

  <script src="/static/qc_review.js"></script>
</body>
</html>
