[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "avocet-radar-toolkit"
version = "0.1.0"
description = "UK radar Weather and Climate Toolkit-style web app and CLI for Avocet radar aggregates."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "h5py>=3.11",
  "numpy>=1.26",
  "pillow>=10.0",
]

[project.optional-dependencies]
export = [
  "rasterio>=1.3",
  "netCDF4>=1.6",
  "pyshp>=2.3",
]
object-store = [
  "boto3>=1.34",
]
dev = [
  "pytest>=8.0",
  "httpx>=0.27",
]

[project.scripts]
avocet-wct = "avocet_radar_toolkit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
avocet_radar_toolkit = ["static/*"]
