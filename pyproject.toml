[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uk-wsr-visualizer"
version = "0.2.1"
description = "Quick-look web app and CLI for UK weather surveillance radar aggregate HDF5 data."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "BSD-3-Clause"}
authors = [
  {name = "Ryan R. Neely III"},
]
keywords = ["weather radar", "UK WSR", "radar meteorology", "HDF5", "JASMIN", "research software"]
dependencies = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "h5py>=3.11",
  "numpy>=1.26",
  "pillow>=10.0",
]

[project.optional-dependencies]
export = [
  "rasterio>=1.3",
  "netCDF4>=1.6",
  "pyshp>=2.3",
]
video = [
  "imageio>=2.34",
  "imageio-ffmpeg>=0.5",
]
linux = [
  "PySide6>=6.7",
  "pyinstaller>=6.6",
]
object-store = [
  "boto3>=1.34",
]
dev = [
  "pytest>=8.0",
  "httpx>=0.27",
]
docs = [
  "sphinx>=8.0",
  "pydata-sphinx-theme>=0.16",
  "myst-parser>=4.0",
  "sphinx-copybutton>=0.5",
  "sphinx-design>=0.6",
]

[project.urls]
Repository = "https://github.com/rrniii/uk-wsr-visualizer"
Documentation = "https://github.com/rrniii/uk-wsr-visualizer#readme"

[project.scripts]
uk-wsr-visualizer = "uk_wsr_visualizer.cli:main"
uk-wsr-visualizer-citation = "uk_wsr_visualizer.citations:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
uk_wsr_visualizer = [
  "static/*",
  "models/background/manifest.json",
  "models/background/qualified/*.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
